[package]
name = "docserver-core"
version.workspace = true
edition.workspace = true
description = "Core: config, indexer, search, and HTTP server for local_docserver"

[[bin]]
name = "docserver"
path = "src/bin/docserver.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
mime_guess = "2"
ignore = "0.4"
notify = "8"
notify-debouncer-mini = "0.6"
fuzzy-matcher = "0.3"
unicode-normalization = "0.1"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
open = "5"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

[dev-dependencies]
tempfile = "3"
